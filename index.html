<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RenzoCcama – Electric Grid Simulation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at top, #0a1a33, #02060f 70%);
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: #e0f7ff;
        }

        .title {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #4dd0e1;
            text-shadow: 0 0 10px #4dd0e1;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.7;
            margin-top: 6px;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <div class="title">
        ⚡ Simulación del Flujo Eléctrico – RenzoCcama
        <div class="subtitle">Generación → Transmisión → Distribución → Consumo</div>
    </div>

    <canvas id="grid"></canvas>

    <script>
        const canvas = document.getElementById("grid");
        const ctx = canvas.getContext("2d");

        let w, h;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        window.addEventListener("resize", resize);
        resize();

        // NODOS DEL SISTEMA ELÉCTRICO
        const nodes = [
            { x: 200, y: h/2 - 150, type: "GEN", label: "Generación" },
            { x: w/2, y: h/2, type: "SUB", label: "Subestación" },
            { x: w - 250, y: h/2 - 120, type: "DIST", label: "Distribución" },
            { x: w - 200, y: h/2 + 150, type: "LOAD", label: "Consumo" }
        ];

        // CONEXIONES (LÍNEAS ELÉCTRICAS)
        const lines = [
            { a: 0, b: 1 }, // generación → subestación
            { a: 1, b: 2 }, // subestación → distribución
            { a: 1, b: 3 }  // subestación → carga
        ];

        // PULSOS DE ELECTRICIDAD
        const pulses = [];

        function spawnPulse(lineIndex) {
            pulses.push({
                line: lineIndex,
                t: 0 // posición entre 0 y 1
            });
        }

        // Generar pulsos constantemente
        setInterval(() => {
            lines.forEach((_, i) => spawnPulse(i));
        }, 600);

        function drawNode(node) {
            ctx.beginPath();
            ctx.arc(node.x, node.y, 35, 0, Math.PI * 2);
            ctx.fillStyle = node.type === "GEN" ? "#00e676" :
                            node.type === "SUB" ? "#29b6f6" :
                            node.type === "DIST" ? "#ffd54f" :
                            "#ff8a80";
            ctx.shadowBlur = 20;
            ctx.shadowColor = ctx.fillStyle;
            ctx.fill();

            ctx.shadowBlur = 0;
            ctx.fillStyle = "#e0faff";
            ctx.font = "16px Arial";
            ctx.textAlign = "center";
            ctx.fillText(node.label, node.x, node.y + 55);
        }

        function drawLine(a, b) {
            ctx.beginPath();
            ctx.lineWidth = 4;
            ctx.strokeStyle = "rgba(100,200,255,0.35)";
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
        }

        function drawPulse(pulse) {
            const line = lines[pulse.line];
            const a = nodes[line.a];
            const b = nodes[line.b];

            const x = a.x + (b.x - a.x) * pulse.t;
            const y = a.y + (b.y - a.y) * pulse.t;

            ctx.beginPath();
            ctx.arc(x, y, 10, 0, Math.PI * 2);
            ctx.fillStyle = "#80e8ff";
            ctx.shadowBlur = 20;
            ctx.shadowColor = "#4dd0e1";
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);

            // Dibujar líneas
            lines.forEach(l => drawLine(nodes[l.a], nodes[l.b]));

            // Dibujar nodos
            nodes.forEach(drawNode);

            // Dibujar pulsos eléctricos
            pulses.forEach((pulse, i) => {
                pulse.t += 0.01; // velocidad
                drawPulse(pulse);

                if (pulse.t > 1) pulses.splice(i, 1);
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
